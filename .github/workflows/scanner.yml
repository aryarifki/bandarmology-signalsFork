name: 📊 Signal Scanner

# CATATAN soal jadwal GitHub Actions free tier:
# Cron di menit :00 (jam bulat) SERING di-skip/delay karena jutaan
# repo menjadwalkan di jam sama. Solusi: pakai menit ganjil (:37, :07)
# dan majukan tiap sesi untuk kompensasi delay yang umum terjadi.
#
# Target WIB (UTC = WIB - 7):
#   PRE_MARKET  ~08:00 WIB → dijadwal 00:37 UTC
#   POST_OPEN   ~10:00 WIB → dijadwal 02:37 UTC
#   MIDDAY      ~13:00 WIB → dijadwal 05:37 UTC
#   POST_MARKET ~16:30 WIB → dijadwal 09:07 UTC

on:
  schedule:
    - cron: '37 0 * * 1-5'   # PRE_MARKET  ~08:00 WIB
    - cron: '37 2 * * 1-5'   # POST_OPEN   ~10:00 WIB
    - cron: '37 5 * * 1-5'   # MIDDAY      ~13:00 WIB
    - cron: '7 9 * * 1-5'    # POST_MARKET ~16:30 WIB
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run'
        required: false
        default: 'PRE_MARKET'
        type: choice
        options: [PRE_MARKET, POST_OPEN, MIDDAY, POST_MARKET]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session
        id: session
        run: |
          # Manual trigger: pakai input langsung
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SESSION=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled: deteksi sesi dari JAM UTC dengan buffer LEBAR
          # untuk mengakomodasi delay GitHub yang bisa 15-60 menit.
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          TOTAL=$((10#$HOUR * 60 + 10#$MIN))

          # Window boundary (menit UTC), buffer utk delay s/d 60min:
          #   PRE_MARKET  : 00:00 - 02:29  (< 150)
          #   POST_OPEN   : 02:30 - 05:29  (< 330)
          #   MIDDAY      : 05:30 - 08:59  (< 540)
          #   POST_MARKET : 09:00+
          if   [ $TOTAL -lt 150 ]; then
            echo "SESSION=PRE_MARKET"   >> $GITHUB_OUTPUT
          elif [ $TOTAL -lt 330 ]; then
            echo "SESSION=POST_OPEN"    >> $GITHUB_OUTPUT
          elif [ $TOTAL -lt 540 ]; then
            echo "SESSION=MIDDAY"       >> $GITHUB_OUTPUT
          else
            echo "SESSION=POST_MARKET"  >> $GITHUB_OUTPUT
          fi

      - name: Run Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBIT_TOKEN:     ${{ secrets.STOCKBIT_TOKEN }}
          SESSION:            ${{ steps.session.outputs.SESSION }}
        run: python3 run_scan.py ${{ steps.session.outputs.SESSION }}

      - name: Commit updated signals.csv
        run: |
          git config user.name  "BandarAI Bot"
          git config user.email "bot@bandarai.id"
          git add data/signals.csv
          if git diff --staged --quiet; then
            echo "No new signals"
          else
            git commit -m "signals ${{ steps.session.outputs.SESSION }} $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
