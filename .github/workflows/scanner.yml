name: 📊 Signal Scanner

# Jadwal (UTC = WIB - 7 jam):
# 08:30 WIB = 01:30 UTC  → PRE_MARKET
# 10:00 WIB = 03:00 UTC  → POST_OPEN
# 13:00 WIB = 06:00 UTC  → MIDDAY
# 16:30 WIB = 09:30 UTC  → POST_MARKET

on:
  schedule:
    - cron: '30 1 * * 1-5'   # PRE_MARKET  08:30 WIB
    - cron: '0 3 * * 1-5'    # POST_OPEN   10:00 WIB
    - cron: '0 6 * * 1-5'    # MIDDAY      13:00 WIB
    - cron: '30 9 * * 1-5'   # POST_MARKET 16:30 WIB
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run'
        required: false
        default: 'PRE_MARKET'
        type: choice
        options: [PRE_MARKET, POST_OPEN, MIDDAY, POST_MARKET]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session
        id: session
        run: |
          # Manual trigger: gunakan input langsung
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SESSION=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled: gunakan JAM UTC (lebih robust dari menit)
          # Memberi buffer lebar untuk GitHub delay (bisa 15-60 menit)
          HOUR=$(date -u +%H)

          if   [ "$HOUR" = "01" ] || [ "$HOUR" = "02" ]; then
            echo "SESSION=PRE_MARKET"   >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "03" ] || [ "$HOUR" = "04" ]; then
            echo "SESSION=POST_OPEN"    >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 5 ] && [ "$HOUR" -le 8 ]; then
            echo "SESSION=MIDDAY"       >> $GITHUB_OUTPUT
          else
            echo "SESSION=POST_MARKET"  >> $GITHUB_OUTPUT
          fi

      - name: Run Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBIT_TOKEN:     ${{ secrets.STOCKBIT_TOKEN }}
          SESSION:            ${{ steps.session.outputs.SESSION }}
        run: python3 run_scan.py ${{ steps.session.outputs.SESSION }}

      - name: Commit updated signals.csv
        run: |
          git config user.name  "BandarAI Bot"
          git config user.email "bot@bandarai.id"
          git add data/signals.csv
          if git diff --staged --quiet; then
            echo "ℹ️  No new signals"
          else
            git commit -m "📊 ${{ steps.session.outputs.SESSION }} $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
